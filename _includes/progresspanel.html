<div class="floating-panel">
    <h2>Page Progress 8</h2>
    <div class="checklist-progressbar">
        <ul>
            {% for thing in site.progressbar.{{ page.id }} %}
              {% if thing == {{ page.id }} %}
                 {% for subthing in thing %}
                  <li>
                      <input type="checkbox" id="{{ subthing }}">
                      <label>{{ subthing }}</label>
                  </li>
                  {% endfor %}
              {% endif %}
            {% endfor %}
        </ul>
        <div class="progressbar">
            <div class="progressbar-inner"></div>
            <div class="progressbar-value"></div>
        </div>
    </div>
</div>
